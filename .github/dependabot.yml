# Workflow actions are pinned to commit SHAs (ci.yml); this keeps the pins current, together with
# the language server's npm packages and the extension's crates. The bundle in server/dist must be
# rebuilt on an npm update: `make check` (dist-check) fails the pull request until it is.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      server:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      crates:
        patterns: ["*"]
